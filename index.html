<!DOCTYPE html>
<html lang="en">
    <head>
        <title>three.js ar - hit test</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <link type="text/css" rel="stylesheet" href="main.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    </head>
    <body>

        <script type="importmap">
            {
                "imports": {
                    "three": "./build/three.module.js",
                    "three/addons/": "./jsm/"
                }
            }
        </script>

        <script type="module">

            import * as THREE from 'three';
            import { ARButton } from 'three/addons/webxr/ARButton.js';
            import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
            import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

            let container;
            let camera, scene, renderer;
            let controller1, controller2;

            let reticle;
            let current_object;
            let pmremGenerator;

            let hitTestSource = null;
            let hitTestSourceRequested = false;

            init();

            function init() {

                container = document.createElement( 'div' );
                document.body.appendChild( container );

                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera( 70, window.innerWidth / window.innerHeight, 0.01, 20 );

                const light = new THREE.HemisphereLight( 0xffffff, 0xbbbbff, 3 );
                light.position.set( 0.5, 1, 0.25 );
                scene.add( light );

                //

                renderer = new THREE.WebGLRenderer( { antialias: true, alpha: true } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );
                renderer.setAnimationLoop( animate );
                renderer.xr.enabled = true;
                container.appendChild( renderer.domElement );
                pmremGenerator = new THREE.PMREMGenerator(renderer);
                pmremGenerator.compileEquirectangularShader();

                //

                document.body.appendChild( ARButton.createButton( renderer, { requiredFeatures: [ 'hit-test' ] } ) );

                //

               function onSelect() {

    if ( reticle.visible && current_object ) {

        current_object.position.setFromMatrixPosition( reticle.matrix );

    }

}

                controller1 = renderer.xr.getController( 0 );
                controller1.addEventListener( 'select', onSelect );
                scene.add( controller1 );

                controller2 = renderer.xr.getController( 1 );
                controller2.addEventListener( 'select', onSelect );
                scene.add( controller2 );

                reticle = new THREE.Mesh(
                    new THREE.RingGeometry( 0.15, 0.2, 32 ).rotateX( - Math.PI / 2 ),
                    new THREE.MeshBasicMaterial()
                );
                reticle.matrixAutoUpdate = false;
                reticle.visible = false;
                scene.add( reticle );

                //

                window.addEventListener( 'resize', onWindowResize );

loadModel("1");

}

            function onWindowResize() {

                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();

                renderer.setSize( window.innerWidth, window.innerHeight );

            }

            function loadModel(model){

    new RGBELoader()
        .setDataType(THREE.HalfFloatType)
        .setPath('textures/')
        .load('golden_bay_2k.hdr', function(texture){

            const envmap = pmremGenerator.fromEquirectangular(texture).texture;
            texture.flipY = false;
            texture.premultiplyAlpha = false;
            scene.environment = envmap;
            texture.dispose();
            pmremGenerator.dispose();

          var loader = new GLTFLoader().setPath('3d/');
loader.load(model + ".glb", function(glb) {

    if (current_object) {
        scene.remove(current_object);
    }

    current_object = glb.scene;
    scene.add(current_object);

});

});

}

$(".ar-object").click(function () {
    const id = $(this).attr("id");
    loadModel(id);
});

            //

            function animate( timestamp, frame ) {

                if ( frame ) {

                    const referenceSpace = renderer.xr.getReferenceSpace();
                    const session = renderer.xr.getSession();

                    if ( hitTestSourceRequested === false ) {

                        session.requestReferenceSpace( 'viewer' ).then( function ( referenceSpace ) {

                            session.requestHitTestSource( { space: referenceSpace } ).then( function ( source ) {

                                hitTestSource = source;

                            } );

                        } );

                        session.addEventListener( 'end', function () {

                            hitTestSourceRequested = false;
                            hitTestSource = null;

                        } );

                        hitTestSourceRequested = true;

                    }

                    if ( hitTestSource ) {

                        const hitTestResults = frame.getHitTestResults( hitTestSource );

                        if ( hitTestResults.length ) {

                            const hit = hitTestResults[ 0 ];

                            reticle.visible = true;
                            reticle.matrix.fromArray( hit.getPose( referenceSpace ).transform.matrix );

                        } else {

                            reticle.visible = false;

                        }

                    }

                }

                renderer.render( scene, camera );

            }

        </script>
        <div id="mySidenav" class="sidenav">
  <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
  <a class="ar-object" id="1" href="#">Objet 1</a>
<a class="ar-object" id="2" href="#">Objet 2</a>
<a class="ar-object" id="3" href="#">Objet 3</a>
<a class="ar-object" id="4" href="#">Objet 4</a>
</div>

<span style="font-size:30px;cursor:pointer" onclick="openNav()">&#9776; open</span>

<script>
function openNav() {
  document.getElementById("mySidenav").style.width = "250px";
}

function closeNav() {
  document.getElementById("mySidenav").style.width = "0";
}
</script>
    </body>
</html>
